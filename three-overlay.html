<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixiJS Window System — Three.js Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f14;
      }

      #overlay-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #overlay-stage {
        position: relative;
      }

      #overlay-stage canvas {
        position: absolute;
        top: 0;
        left: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="overlay-root">
      <div id="overlay-stage"></div>
    </div>
    <script type="module" src="/examples/three-overlay.ts"></script>
  </body>
</html>
