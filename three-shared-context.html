<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixiJS Window System — Three.js Shared Context</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f14;
      }

      #shared-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #shared-stage canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="shared-root">
      <div id="shared-stage"></div>
    </div>
    <script type="module" src="/examples/three-shared-context.ts"></script>
  </body>
</html>
