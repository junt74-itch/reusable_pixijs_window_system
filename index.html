<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixiJS Window System — Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f14;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #app canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p
      style="
        position: fixed;
        left: 8px;
        bottom: 8px;
        margin: 0;
        padding: 6px 10px;
        font: 12px/1.4 monospace;
        color: #c8c8d0;
        background: rgba(15, 15, 20, 0.82);
        border-radius: 4px;
        pointer-events: none;
      "
    >
      say → choose: Enter/Space 確定 · MessageWindow: C close · O open · H hide · S show · D destroy 演習
    </p>
    <script type="module" src="/examples/main.ts"></script>
  </body>
</html>
